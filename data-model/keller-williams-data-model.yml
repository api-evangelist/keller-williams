note: >-
  Derived from the only anonymously published Keller Williams contract —
  the KW Worldwide Listings Search OpenAPI 3.0.1 — plus the entity shapes
  visible in the Marketplace webhook sample payloads. The rest of the KW
  domain (Contacts, Opportunities, Tasks, Users, Organizations, Roles) is
  behind the SAML-gated DevHub catalog and is represented here only where
  a public artifact evidences it. Nothing is invented.
summary:
  entities: 8
  relationships: 12
  root_entity: Listing
  id_style: >-
    Mixed. Listings carry both a Mongo-style 24-hex `list_uuid`
    ("668c51b17c9422975e4f12d6") and a numeric `list_id`, plus a
    composite human key `list_key` of the form "<mls_id>-<mls_number>"
    (e.g. "KWW_KIWI-123456"). People are identified by a numeric
    `kw_uid` (KWUID). Organizations use a numeric `id` with a separate
    `org_key`. Marketplace subscriptions use partner-issued
    `accountIdentifier` UUIDs and KW-issued user `uuid`s.
entities:
