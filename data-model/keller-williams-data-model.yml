    lock_fields:
      note: >-
        A distinctive KWLS pattern — parallel *_lock booleans
        (list_desc_lock, list_status_lock, prop_type_lock,
        prop_subtype_lock, photos_lock, open_houses_lock,
        virtual_tours_lock, contract_expiry_dt_lock, kw_expiry_dt_lock)
        that pin a field against overwrite by an upstream feed.
    i18n_fields:
      note: >-
        Parallel *_transkey fields (list_status_transkey,
        list_type_transkey, list_category_transkey, prop_type_transkey,
        kwls_status_transkey, living_area_units_transkey,
        lot_size_units_transkey) carry translation keys for the KW
        Worldwide multi-locale surface, alongside list_desc_en.
