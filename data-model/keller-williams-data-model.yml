    shape: "{id, value, value_transkey, sa_mapping, ...}"
    note: >-
      The controlled-vocabulary service. Each hit is discriminated by
      _id (an enum of the table name) and carries an array of
      {id, value, value_transkey} rows — this is where the numeric
      *_id fields on a Listing resolve.
  - name: Region
