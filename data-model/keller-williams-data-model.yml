gaps:
  - "Contacts, Opportunities, Tasks and Timelines are documented in prose (developer.kw.com/timelines, /filtering-and-sorting) but have no anonymously published schema — the v3 Contacts catalog entry is SAML-gated."
  - "No $ref-based schema reuse between the listing read shape (_source) and the create/update shapes (ListingsCreate/ListingsUpdate) — the same 100+ fields are re-declared inline in each."
  - "The response envelope is Elasticsearch's, so took/timed_out/_shards/hits leak the storage engine into the public contract."
