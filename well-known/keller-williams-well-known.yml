source: live probes of every apis.yml baseURL host, every OpenAPI servers[] host and the docs host
summary:
  documents_found: 1
  security_txt: false
  openid_configuration: true
  oauth_authorization_server: false
  oauth_protected_resource: false
  api_catalog: false
  ai_plugin: false
  note: >-
    The only machine-readable discovery document Keller Williams serves is
    the OpenID Connect configuration, and it is NOT at the RFC 8414 /
    OIDC-Discovery default location for the issuer. The issuer claims
    "https://partners.api.kw.com" but the document is served from the
    /idp path prefix, so a spec-compliant client resolving
    https://partners.api.kw.com/.well-known/openid-configuration gets a
    404. This is a real discovery defect worth reporting to KWRI.
    developer.kw.com is an Angular single-page app that answers every
    unmatched path with the same 2,138-byte HTML shell at HTTP 200 —
    those are false positives, not documents, and are recorded as such.
    kw.com, www.kw.com and legal.kw.com sit behind Cloudflare bot
    protection and return 403 to any non-browser client.
hosts:
