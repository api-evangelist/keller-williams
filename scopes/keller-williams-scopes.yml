summary:
  scopes_total: 40
  advertised_by_discovery: 40
  documented_in_portal: 8
  documented_but_not_advertised: 1
  oidc_standard: 4
  note: >-
    Keller Williams advertises 40 OAuth 2.0 / OpenID Connect scopes in its
    public discovery document, but the DevHub "Getting Started" guide only
    describes 8 of them as selectable products at application-creation
    time. The remaining 32 exist on the authorization server and are
    granted by KWRI on a per-partnership basis; there is no published
    scope reference page enumerating them. One scope named in the docs
    (`read_user`) is NOT advertised by the discovery document, which
    instead exposes `read_all_user` and `read_all_users_lw` — a real
    docs/server divergence, recorded rather than reconciled.
    Scope selection happens in the DevHub app-creation UI, and the chosen
    scopes are what the end user sees on the Command consent screen.
    `openid` and `profile` are required defaults on every /authorize call.
schemes:
  - name: OpenIDConnect
    type: openIdConnect
    issuer: https://partners.api.kw.com
    discovery: https://partners.api.kw.com/idp/.well-known/openid-configuration
    flows:
      - flow: authorizationCode
        authorizationUrl: https://partners.api.kw.com/idp/authorize
        tokenUrl: https://partners.api.kw.com/idp/token
        refreshUrl: https://partners.api.kw.com/idp/token
        pkce: S256
      - flow: implicit
        authorizationUrl: https://partners.api.kw.com/idp/authorize
      - flow: clientCredentials
        tokenUrl: https://partners.api.kw.com/idp/token
      - flow: tokenExchange
        tokenUrl: https://partners.api.kw.com/idp/token
        grant_type: urn:ietf:params:oauth:grant-type:token-exchange
      - flow: jwtBearer
        tokenUrl: https://partners.api.kw.com/idp/token
        grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
    revocation_endpoint: https://partners.api.kw.com/idp/revoke
    introspection_endpoint: https://partners.api.kw.com/idp/introspect
    userinfo_endpoint: https://partners.api.kw.com/idp/userinfo
    end_session_endpoint: https://partners.api.kw.com/idp/end_session
    device_authorization_endpoint: https://partners.api.kw.com/idp/device_authorization
