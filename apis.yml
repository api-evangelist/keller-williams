  - aid: keller-williams:keller-williams-partner-identity-api
    name: KW Partner Identity API (OpenID Connect)
    description: >-
      Keller Williams uses OpenID Connect on top of OAuth 2.0 to grant a
      partner application access to an individual KW user's Command data. The
      authorization server at partners.api.kw.com/idp serves a publicly
      readable OpenID Connect discovery document advertising authorize, token,
      introspect, userinfo, revoke, end_session and device_authorization
      endpoints, RS256 ID tokens, PKCE S256, and 40 supported scopes covering
      contacts, tasks, listings, organizations, users, opportunities,
      recruiting and marketing profiles. The DevHub Getting Started guide
      documents the authorization-code flow, the consent screen, token
      exchange with base64 client_secret_basic credentials, and logout via the
      revoke endpoint. A separate partner token-refresh endpoint is documented
      under /v2/oauth2/partner/token.
    humanURL: https://developer.kw.com/getting-started
    baseURL: https://partners.api.kw.com/idp
    tags:
      - Authentication
      - OpenID Connect
      - OAuth 2.0
      - Scopes
    properties:
      - type: OpenIDConnectDiscovery
        url: authentication/keller-williams-openid-configuration.json
      - type: Documentation
        url: https://developer.kw.com/getting-started
      - type: Documentation
        url: https://developer.kw.com/docs-authentication
      - type: Documentation
        url: https://developer.kw.com/docs-refresh-token
      - type: Authentication
        url: authentication/keller-williams-authentication.yml
      - type: OAuthScopes
        url: scopes/keller-williams-scopes.yml
      - type: WellKnown
        url: well-known/keller-williams-well-known.yml
  - aid: keller-williams:keller-williams-marketplace-subscription-api
    name: KW Marketplace Subscription & Metered Billing API
    description: >-
      The partner-facing surface behind the KW Marketplace, where vendors sell
      products to Keller Williams agents. Keller Williams pushes subscription
      lifecycle events — subscription creation, subscription creation for
      teams, subscription change, subscription cancel, status notification,
      user assignment and user unassignment — to a partner's secured HTTPS
      endpoint registered with the KW team, and partners report consumption
      back through a pre-configured metered billing endpoint that accepts a
      quantity and unit type per account. Sample payloads, synchronous and
      asynchronous subscription flows, an error-code reference and a
      subscription lifecycle walkthrough are published publicly on DevHub; no
      OpenAPI document is offered for this surface.
    humanURL: https://developer.kw.com/marketplace-documentation
    baseURL: https://partners.api.kw.com/v1
    tags:
      - Marketplace
      - Subscriptions
      - Billing
      - Events
    properties:
      - type: Documentation
        url: https://developer.kw.com/marketplace-documentation
      - type: Documentation
        url: https://developer.kw.com/metered-billing
      - type: Documentation
        url: https://developer.kw.com/subscription-lifecycle-walkthrough
      - type: Documentation
        url: https://developer.kw.com/docs-synchronous-subscription
      - type: Documentation
        url: https://developer.kw.com/docs-asynchronous-subscription
