aid: keller-williams
name: Keller Williams
kind: company
url: https://raw.githubusercontent.com/api-evangelist/keller-williams/refs/heads/main/apis.yml
description: >-
  Keller Williams Realty, Inc. (KWRI) is an Austin, Texas headquartered
  residential real estate franchisor and the largest real estate brokerage
  franchise in the United States by agent count, operating more than 1,000
  market centers worldwide through independently owned and operated offices.
  In the value chain Keller Williams sits at the brokerage and agent-platform
  layer, not the data-cooperative layer: it franchises brokerages, and it
  builds and operates KW Command, a proprietary agent operating system for
  lead, contact, task, listing, opportunity and marketing management, plus
  the KW Marketplace where third-party vendors sell integrated products to KW
  agents. Its API posture is real but partner-gated. Keller Williams runs a
  genuine Apigee-backed developer portal (DevHub) at developer.kw.com with a
  live gateway at partners.api.kw.com and a sandbox at
  sandbox.partners.api.kw.com, an OpenID Connect authorization server whose
  discovery document is publicly readable, and a published API License
  Agreement. Access is not self-serve: a developer must submit a partnership
  application through the "Apply to Integrate" form, be approved by KWRI,
  receive a DevHub account, then sign the KW API License Agreement and Terms
  of Use before receiving an API key and secret. Only one API — KW Worldwide
  Listings Search — is visible anonymously in the API catalog; the rest of
  the catalog (Command MC, Contact and Lead Data, Tasks, Opportunity/Deal/
  Transaction Data, User/Organization/Role Information, Marketplace
  Subscription Management, Internal) is behind a SAML member login. On the
  sector's central question, Keller Williams carries no RESO posture at all:
  it is absent from the RESO certification directory, no RESO Web API, Data
  Dictionary, OData $metadata or Universal Property Identifier reference
  appears anywhere in its developer portal or specification, and its own
  listings spec states in its description that the service "is not a
  substitution for or tied to any Multiple Listings Services database
  records." This is a brokerage's own listing and CRM data behind a
  commercial partner agreement, not licensed MLS data behind a certified
  standard.
