apis:
  - aid: keller-williams:keller-williams-worldwide-listings-search-api
    name: KW Worldwide Listings Search API
    description: >-
      The only Keller Williams API whose specification is published anonymously
      in the DevHub API catalog. The KW Worldwide Listings service returns
      Keller Williams Listing Service (KWLS) listings scoped to a KW Worldwide
      region, and supports listing create, update and delete plus a lookup
      table of controlled vocabularies (property types, statuses, flooring,
      roof type, appliances, currency, country, state/province and more) and an
      organization-people lookup. The published OpenAPI 3.0.1 document declares
      5 paths and 8 operations against a production and a sandbox server. The
      spec's own description states the service is not a substitution for, or
      tied to, any Multiple Listing Service database records. Access requires
      an approved DevHub application; requests carry an API key plus a Basic or
      Bearer credential.
    humanURL: https://developer.kw.com/docs/listingskww/1/overview
    baseURL: https://partners.api.kw.com/v2
    tags:
      - Property Listings
      - Search
      - KW Worldwide
      - KWLS
